# ===================================================================
# Spring Cloud Consul Config bootstrap configuration for the "dev" profile
# In prod profile, properties will be overwritten by the ones defined in bootstrap-prod.yml
# ===================================================================

spring:
  application:
    name: msroute
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: "@spring.profiles.active@"
  cloud:
    vault:
      uri: https://vault.${DOMAIN}
      token: ${VAULT_TOKEN:${F4_PASSWORD}}
      scheme: https
      kv:
        enabled: true
        backend: secret
        application-name: common-kafka
      # Import infrastructure secrets
      configuration:
        infrastructure: secret/infrastructure

    consul:
      enabled: true
      host: consul.${DOMAIN}
      port: 443
      scheme: https

      # TLS configuration
      tls:
        skip-verify: true

      # Consul Config (KV store)
      config:
        enabled: true
        format: YAML
        acl-token: ${CONSUL_TOKEN:${F4_PASSWORD}}
        profile-separator: "-"
        watch:
          enabled: true
          delay: 2000
      # Consul Discovery (service registration/discovery)
      discovery:
        enabled: true
        register: true
        prefer-ip-address: false
        health-check-path: /management/health
        health-check-interval: 10s

        acl-token: ${CONSUL_TOKEN:${F4_PASSWORD}}


  config:
    import: optional:file:.env[.properties],vault://secret/infrastructure,vault://secret/common-kafka
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
      file: src/main/docker/mysql.yml

# Consul health indicator enabled safely with proper agent:read ACL permissions
management:
  health:
    consul:
      enabled: ${CONSUL_HEALTH_ENABLED:true}
